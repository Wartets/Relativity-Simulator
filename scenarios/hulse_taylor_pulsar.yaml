scenario_name: "Hulse-Taylor Pulsar PSR B1913+16"
description: "High-precision binary neutron star system reproducing Peters-Mathews gravitational radiation orbital decay."
spacetime:
  metric_type: "Schwarzschild"
  central_mass: 2.8284
  central_spin: 0.0
  central_charge: 0.0
  cosmological_lambda: 0.0
  wormhole_throat: 1.0
  warp_velocity: 0.0
  speed_of_light: 1.0
  gravitational_constant: 1.0
integrator:
  scheme: "Hermite4"
  initial_step: 0.01
  min_step: 1.0e-08
  max_step: 10.0
  relative_tolerance: 1.0e-10
  absolute_tolerance: 1.0e-14
output:
  fits_enabled: true
  hdf5_enabled: true
  vtk_enabled: true
  export_directory: "./output"
bodies:
  - name: "Pulsar PSR B1913+16"
    body_id: 1
    mass: 1.44
    radius: 0.05
    spin: 0.0
    charge: 0.0
    position: [0.0, 15.0, 0.0, 0.0]
    velocity: [1.0, 0.0, 0.22, 0.0]
  - name: "Companion Neutron Star"
    body_id: 2
    mass: 1.388
    radius: 0.05
    spin: 0.0
    charge: 0.0
    position: [0.0, -15.56, 0.0, 0.0]
    velocity: [1.0, 0.0, -0.228, 0.0]
observers:
  - name: "PrimaryCamera"
    fov_deg: 40.0
    resolution: [1920, 1080]
    position: [0.0, 0.0, 120.0, 0.0]
    four_velocity: [1.0, 0.0, 0.0, 0.0]
