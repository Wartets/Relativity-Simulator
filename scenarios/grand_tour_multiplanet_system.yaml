scenario_name: "Grand Tour Multi-Planet System"
description: "Extended terrestrial-to-gas-giant planetary system (Mercury, Venus, Earth, Mars, Jupiter) around a solar-mass star, exercising multi-body 1PN dynamics and zonal harmonic perturbations simultaneously."
author: "C. Bossu Réaubourg"
version_tag: "1.0.0"
spacetime:
  metric_type: "Schwarzschild"
  central_mass: 1.98847e30
  central_spin: 0.0
  central_charge: 0.0
  cosmological_lambda: 0.0
  wormhole_throat: 0.0
  warp_velocity: 0.0
  speed_of_light: 299792458.0
  gravitational_constant: 6.67430e-11
integrator:
  scheme: "GaussLegendre6"
  initial_step: 3600.0
  min_step: 1.0
  max_step: 86400.0
  relative_tolerance: 1.0e-12
  absolute_tolerance: 1.0e-15
output:
