scenario_name: "Hulse-Taylor Pulsar PSR B1913+16"
description: "High-precision binary neutron star system reproducing Peters-Mathews gravitational radiation orbital decay."
author: "C. Bossu Réaubourg"
version_tag: "1.1.1"
units:
  distance: "km"
  mass: "M_sun"
  velocity: "km/s"
  time: "s"
  energy: "J"
  temperature: "K"
  charge: "C"
  angle: "deg"
spacetime:
  metric_type: "Schwarzschild"
  central_mass: 2.8284
  central_spin: 0.0
  central_charge: 0.0
  cosmological_lambda: 0.0
  wormhole_throat: 1.0
  warp_velocity: 0.0
  speed_of_light: 1.0
  gravitational_constant: 1.0
integrator:
  scheme: "Hermite4"
  initial_step: 0.01
  min_step: 1.0e-08
  max_step: 10.0
  relative_tolerance: 1.0e-10
  absolute_tolerance: 1.0e-14
output:
  fits_enabled: true
  hdf5_enabled: true
  vtk_enabled: true
  export_directory: "./output"
interactions:
  electricity_enabled: false
  magnetism_enabled: false
  vacuum_permittivity: 8.8541878128e-12
