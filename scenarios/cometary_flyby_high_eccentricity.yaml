scenario_name: "High-Eccentricity Cometary Flyby"
description: "A small icy body on a highly eccentric hyperbolic-like flyby trajectory around a Schwarzschild black hole, exercising adaptive step-size control near periapsis."
author: "C. Bossu Réaubourg"
version_tag: "1.1.1"
units:
  distance: "km"
  mass: "M_sun"
  velocity: "km/s"
  time: "s"
  energy: "J"
  temperature: "K"
  charge: "C"
  angle: "deg"
spacetime:
  metric_type: "Schwarzschild"
  central_mass: 1.0
  central_spin: 0.0
  central_charge: 0.0
  cosmological_lambda: 0.0
  wormhole_throat: 1.0
  warp_velocity: 0.0
  speed_of_light: 1.0
  gravitational_constant: 1.0
integrator:
  scheme: "Cash-Karp"
  initial_step: 0.01
  min_step: 1.0e-09
  max_step: 3.0
  relative_tolerance: 1.0e-12
  absolute_tolerance: 1.0e-16
output:
  fits_enabled: false
  hdf5_enabled: true
  vtk_enabled: true
  export_directory: "./output"
interactions:
  electricity_enabled: false
  magnetism_enabled: false
  vacuum_permittivity: 8.8541878128e-12
  vacuum_permeability: 1.25663706212e-6
  collisions_enabled: false
  collision_response_model: 0
  collision_consider_rotation: true
  collision_consider_friction: true
  collision_restitution_multiplier: 1.0
  collision_stiffness_scale: 1.0e-9
  collision_position_correction_factor: 0.2
  thermodynamics_enabled: false
  ambient_temperature_kelvin: -1.0
  radiative_coupling_scale: 1.0
  fragmentation_enabled: false
  fragmentation_tidal_stress_enabled: false
  minimum_fragment_mass: 1.0e-6
  max_fragments_per_event: 2
  collision_energy_to_integrity_loss: 1.0e-6
  tidal_stress_to_integrity_loss: 1.0e-6
  annihilation_enabled: false
  annihilation_contact_scale: 1.0
  annihilation_require_opposite_charge: true
time:
  warp_factor: 0.5
  tick_rate: 10.0
  is_paused: true
bodies:
  - name: "Icy Comet"
    body_id: 1
    mass: 1.0e-8
    radius: 1.5
    spin: 0.05
    charge: 0.0
    enabled: true
    preset_3d: "icegiant"
    surface_texture_mode: "icycracked"
    color: [0.35, 0.45, 0.55, 1.0]
    color_secondary: [0.65, 0.85, 0.98, 1.0]
    color_tertiary: [0.95, 0.98, 1.0, 1.0]
    surface_noise_scale: 8.0
    surface_roughness: 0.85
    texture_detail_scale: 2.0
    emission_intensity: 0.2
    atmosphere_mode: "thickhaze"
    atmosphere_thickness: 0.32
    atmosphere_color: [0.3, 0.65, 1.0, 0.7]
    magnetic_moment: 0.0
    rotation_speed: 0.0
    friction_coefficient: 0.0
    restitution: 0.5
    integrity: 1.0
    lifetime: 0.0
    temperature: 90.0
    heat_capacity: 100.0
    absorption_factor: 0.6
    composition: "Volatile ice-dust nucleus"
    position: [0.0, 50.0, 0.0, 0.0]
    velocity: [0.0, -0.025, 0.175, 0.0]
    quadrupole: 0.0
    j2: 0.0
    j3: 0.0
    j4: 0.0
    reference_radius: 0.5
    mass_unit: "M_sun"
    radius_unit: "km"
    position_unit: "km"
    velocity_unit: "km/s"
    temperature_unit: "K"
    charge_unit: "C"
observers:
  - name: "PrimaryCamera"
    fov_deg: 55.0
    resolution: [1920, 1080]
    position: [0.0, -15.0, 25.0, 6.0]
    target_name: "Icy Comet"
    orientation_convention: 1
    position_unit: "km"
    fov_unit: "deg"
    four_velocity: [1.0, 0.0, 0.0, 0.0]
