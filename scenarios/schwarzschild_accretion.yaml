scenario_name: "Schwarzschild Black Hole & Accretion Disk"
description: "Static Schwarzschild black hole with an equatorial Novikov-Thorne accretion disk and gravitational lensing."
author: "C. Bossu Réaubourg"
version_tag: "1.1.0"
spacetime:
  metric_type: "Schwarzschild"
  central_mass: 1.0
  central_spin: 0.0
  central_charge: 0.0
  cosmological_lambda: 0.0
  wormhole_throat: 1.0
  warp_velocity: 0.0
  speed_of_light: 1.0
  gravitational_constant: 1.0
integrator:
  scheme: "RK45"
  initial_step: 0.01
  min_step: 1.0e-08
  max_step: 10.0
  relative_tolerance: 1.0e-10
  absolute_tolerance: 1.0e-14
output:
  fits_enabled: true
  hdf5_enabled: true
  vtk_enabled: true
  export_directory: "./output"
interactions:
  electricity_enabled: false
  magnetism_enabled: false
  vacuum_permittivity: 8.8541878128e-12
  vacuum_permeability: 1.25663706212e-6
  collisions_enabled: false
  collision_response_model: 0
  collision_consider_rotation: true
  collision_consider_friction: true
  collision_restitution_multiplier: 1.0
  collision_stiffness_scale: 1.0e-9
  collision_position_correction_factor: 0.2
  thermodynamics_enabled: false
  ambient_temperature_kelvin: -1.0
  radiative_coupling_scale: 1.0
  fragmentation_enabled: false
  fragmentation_tidal_stress_enabled: false
  minimum_fragment_mass: 1.0e-6
  max_fragments_per_event: 2
  collision_energy_to_integrity_loss: 1.0e-6
  tidal_stress_to_integrity_loss: 1.0e-6
  annihilation_enabled: false
  annihilation_contact_scale: 1.0
  annihilation_require_opposite_charge: true
bodies: []
observers:
  - name: "PrimaryCamera"
    fov_deg: 60.0
    resolution: [1920, 1080]
    position: [0, -5, 37, -7]
    orientation: [0, 130, 0]
    four_velocity: [1.0, 0.0, 0.0, 0.0]
