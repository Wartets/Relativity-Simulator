scenario_name: "Solar System Mercury"
description: "High-precision 1PN Post-Newtonian Solar System Ephemeris validation for Mercury perihelion precession"
author: "C. Bossu Réaubourg"
version_tag: "1.2.0"
spacetime:
  metric_type: "Schwarzschild"
  central_mass: 1.98847e30
  central_spin: 0.0
  central_charge: 0.0
  cosmological_lambda: 0.0
  wormhole_throat: 0.0
  warp_velocity: 0.0
  speed_of_light: 299792458.0
  gravitational_constant: 6.67430e-11
integrator:
  scheme: "RK45"
  initial_step: 100.0
  min_step: 1.0
  max_step: 3600.0
  relative_tolerance: 1.0e-13
  absolute_tolerance: 1.0e-16
output:
