    preset_3d: "blackhole"
    color: [0.03, 0.03, 0.05, 1.0]
    color_secondary: [0.5, 0.2, 0.7, 1.0]
    disk_enabled: true
    disk_inner_scale: 1.0
    disk_outer_rg: 24.0
    disk_peak_temp: 36000.0
    disk_brightness: 1.3
    position: [0.0, 3.2e5, 0.0, 0.0]
    velocity: [299792458.0, 0.0, 5.55e7, 0.0]
    reference_radius: 8.85e4
    mass_unit: "kg"
    radius_unit: "m"
    position_unit: "m"
    velocity_unit: "m/s"
  - name: "Kerr BH Secondary"
    body_id: 2
