scenario_name: "Morris-Thorne Traversable Wormhole"
description: "Static spherically symmetric traversable wormhole connecting two asymptotically flat spacetime sheets."
author: "C. Bossu Réaubourg"
version_tag: "1.2.0"
units:
  distance: "km"
  mass: "M_sun"
  velocity: "km/s"
  time: "s"
  energy: "J"
  temperature: "K"
  charge: "C"
  angle: "deg"
spacetime:
