    color_tertiary: [1.0, 0.98, 0.85, 1.0]
    emission_intensity: 2.5
    atmosphere_mode: "glowingcorona"
    atmosphere_thickness: 0.0
    temperature: 5772.0
    position: [0.0, 0.0, 0.0, 0.0]
    velocity: [0.0, 0.0, 0.0, 0.0]
    reference_radius: 4.69
