scenario_name: "Binary Black Hole Inspiral"
description: "Binary black hole orbital inspiral with 3.5PN gravitational radiation reaction and strain polarization generation"
author: "C. Bossu Réaubourg"
version_tag: "1.4.0"
units:
  distance: "m"
  mass: "kg"
  velocity: "m/s"
  time: "s"
  energy: "J"
  temperature: "K"
  charge: "C"
  angle: "rad"
sources:
  - name: "Kerr BH Companion"
    body_id: 2
    is_spacetime_source: true
    mass: 0.5
    radius: 0.94
    spin: 0.65
    charge: 0.0
    enabled: true
    preset_3d: "blackhole"
    color: [0.03, 0.03, 0.05, 1.0]
    color_secondary: [0.8, 0.4, 0.15, 1.0]
    disk_enabled: true
    disk_inner_scale: 1.0
    disk_outer_rg: 16.0
    disk_peak_temp: 28000.0
    disk_brightness: 1.1
    position: [0.0, 32.0, 0.0, 0.0]
    velocity: [0.0, 0.0, 0.216, 0.0]
    reference_radius: 0.94
time:
  warp_factor: 1.0
  tick_rate: 60.0
  is_paused: true
skybox:
  enabled: true
  stars_enabled: true
  star_density: 70.0
  nebula_enabled: true
integrator:
  scheme: "RK45"
  initial_step: 0.01
  min_step: 1.0e-8
  max_step: 5.0
  relative_tolerance: 1.0e-10
  absolute_tolerance: 1.0e-14
output:
  fits_enabled: false
  hdf5_enabled: true
  vtk_enabled: true
  export_directory: "./output"
interactions:
  electricity_enabled: false
  magnetism_enabled: false
  vacuum_permittivity: 8.8541878128e-12
  vacuum_permeability: 1.25663706212e-6
  collisions_enabled: false
  collision_response_model: 0
  collision_consider_rotation: true
  collision_consider_friction: true
  collision_restitution_multiplier: 1.0
  collision_stiffness_scale: 1.0e-9
  collision_position_correction_factor: 0.2
  thermodynamics_enabled: false
  ambient_temperature_kelvin: -1.0
  radiative_coupling_scale: 1.0
  fragmentation_enabled: false
  fragmentation_tidal_stress_enabled: false
  minimum_fragment_mass: 1.0e-6
  max_fragments_per_event: 2
  collision_energy_to_integrity_loss: 1.0e-6
  tidal_stress_to_integrity_loss: 1.0e-6
  annihilation_enabled: false
  annihilation_contact_scale: 1.0
  annihilation_require_opposite_charge: true
sources:
  - name: "Kerr BH Companion"
    body_id: 2
    is_spacetime_source: true
    mass: 0.5
    radius: 0.94
    spin: 0.65
    charge: 0.0
    enabled: true
    preset_3d: "blackhole"
    color: [0.03, 0.03, 0.05, 1.0]
    color_secondary: [0.8, 0.4, 0.15, 1.0]
    disk_enabled: true
    disk_inner_scale: 1.0
    disk_outer_rg: 16.0
    disk_peak_temp: 28000.0
    disk_brightness: 1.1
    position: [0.0, 32.0, 0.0, 0.0]
    velocity: [0.0, 0.0, 0.216, 0.0]
    reference_radius: 0.94
observers:
  - name: "BinaryObserver"
    fov_deg: 50.0
    resolution: [1920, 1080]
    position: [0.0, 0.0, 72.0, 24.0]
    target_name: "origin"
    orientation_convention: 1
    position_unit: "km"
    fov_unit: "deg"
    four_velocity: [1.0, 0.0, 0.0, 0.0]
