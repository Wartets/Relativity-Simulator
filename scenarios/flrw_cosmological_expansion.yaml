scenario_name: "FLRW Flat Lambda-CDM Expansion"
description: "Homogeneous and isotropic Friedmann-Lemaitre-Robertson-Walker spacetime demonstrating cosmological expansion under a flat Lambda-CDM model."
author: "C. Bossu Réaubourg"
version_tag: "1.1.0"
units:
  distance: "kpc"
  mass: "M_sun"
  velocity: "km/s"
  time: "yr"
  energy: "J"
  temperature: "K"
  charge: "C"
  angle: "deg"
spacetime:
  metric_type: "FLRW"
  central_mass: 1.0
  central_spin: 0.0
  central_charge: 0.0
  cosmological_lambda: 0.7
  wormhole_throat: 1.0
  warp_velocity: 0.0
  speed_of_light: 1.0
  gravitational_constant: 1.0
integrator:
  scheme: "RK45"
  initial_step: 0.01
  min_step: 1.0e-08
  max_step: 10.0
  relative_tolerance: 1.0e-9
  absolute_tolerance: 1.0e-13
output:
  fits_enabled: false
  hdf5_enabled: true
  vtk_enabled: true
  export_directory: "./output"
interactions:
