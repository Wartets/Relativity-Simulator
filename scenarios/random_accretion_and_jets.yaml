scenario_name: "Stochastic Accretion & Relativistic Jets"
description: "Exploring the visual parameter space of relativistic thin accretion disks and Blandford-Znajek magnetosphere jets with stochastic range sampling."
author: "C. Bossu Réaubourg"
version_tag: "1.0.1"
units:
  distance: "km"
  mass: "M_sun"
  velocity: "km/s"
  time: "s"
  energy: "J"
  temperature: "K"
  charge: "C"
  angle: "deg"
spacetime:
  metric_type: "Kerr"
  central_mass: "[1.0, 2.5]"
  central_spin: "[0.75, 0.998]"
  central_charge: 0.0
  cosmological_lambda: 0.0
  wormhole_throat: 0.0
  warp_velocity: 0.0
  speed_of_light: 1.0
  gravitational_constant: 1.0
time:
  warp_factor: 1.0
  tick_rate: 60.0
  is_paused: true
skybox:
  enabled: true
  stars_enabled: true
  star_density: "[75.0, 110.0]"
  star_brightness: "[1.5, 2.2]"
  nebula_enabled: true
  nebula_intensity: "[0.18, 0.38]"
primary_disk:
  enabled: true
  inner_radius_scale: "[1.0, 2.0]"
  outer_radius_mass_units: "[20.0, 50.0]"
  peak_temperature_k: "[14000.0, 42000.0, 'log']"
