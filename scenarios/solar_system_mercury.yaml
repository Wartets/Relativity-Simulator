    body_id: 10
    mass: 1.0
    radius: 4.69
    spin: 0.0
    charge: 0.0
    enabled: true
    preset_3d: "star"
    surface_texture_mode: "sunphotosphere"
    color: [1.0, 0.88, 0.55, 1.0]
