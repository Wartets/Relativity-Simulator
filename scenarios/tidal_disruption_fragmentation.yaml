scenario_name: "Tidal Disruption and Rubble Fragmentation"
description: "A loosely bound rubble-pile asteroid on a near-plunging orbit around a Schwarzschild black hole, disintegrating under tidal stress and fragmenting into debris."
author: "C. Bossu Réaubourg"
version_tag: "1.0.0"
spacetime:
  metric_type: "Schwarzschild"
  central_mass: 10.0
  central_spin: 0.0
  central_charge: 0.0
  cosmological_lambda: 0.0
  wormhole_throat: 1.0
  warp_velocity: 0.0
  speed_of_light: 1.0
  gravitational_constant: 1.0
integrator:
  scheme: "RK45"
  initial_step: 0.005
  min_step: 1.0e-08
  max_step: 2.0
  relative_tolerance: 1.0e-11
  absolute_tolerance: 1.0e-15
output:
  fits_enabled: false
  hdf5_enabled: true
  vtk_enabled: true
  export_directory: "./output"
interactions:
  electricity_enabled: false
  magnetism_enabled: false
  vacuum_permittivity: 8.8541878128e-12
  vacuum_permeability: 1.25663706212e-6
  collisions_enabled: false
  collision_response_model: 0
  collision_consider_rotation: true
  collision_consider_friction: true
  collision_restitution_multiplier: 1.0
  collision_stiffness_scale: 1.0e-9
  collision_position_correction_factor: 0.2
  thermodynamics_enabled: false
  ambient_temperature_kelvin: -1.0
  radiative_coupling_scale: 1.0
  fragmentation_enabled: true
  fragmentation_tidal_stress_enabled: true
  minimum_fragment_mass: 1.0e-9
  max_fragments_per_event: 6
  collision_energy_to_integrity_loss: 1.0e-6
  tidal_stress_to_integrity_loss: 5.0e-4
  annihilation_enabled: false
  annihilation_contact_scale: 1.0
  annihilation_require_opposite_charge: true
bodies:
  - name: "Rubble Pile Asteroid"
    body_id: 1
    mass: 1.0e-6
    radius: 0.08
    spin: 0.0
    charge: 0.0
    enabled: true
    color: [0.55, 0.5, 0.45, 1.0]
    color_secondary: [0.35, 0.3, 0.28, 1.0]
    magnetic_moment: 0.0
    rotation_speed: 0.02
    friction_coefficient: 0.4
    restitution: 0.2
    integrity: 1.0
    lifetime: 0.0
    temperature: 250.0
    heat_capacity: 1.0e3
    absorption_factor: 0.9
    composition: "Loosely bound carbonaceous rubble pile"
    position: [0.0, 25.0, 0.0, 0.0]
    velocity: [0.0, -0.14, 0.055, 0.0]
    quadrupole: 0.0
    j2: 0.0
    j3: 0.0
    j4: 0.0
    reference_radius: 0.08
observers:
  - name: "PrimaryCamera"
    fov_deg: 60.0
    resolution: [1920, 1080]
    position: [0.0, 0.0, 40.0, 8.0]
    four_velocity: [1.0, 0.0, 0.0, 0.0]
