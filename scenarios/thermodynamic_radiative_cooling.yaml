scenario_name: "Radiative Cooling Demonstration"
description: "A single overheated body cooling toward a fixed ambient temperature via Stefan-Boltzmann radiative exchange in flat spacetime."
author: "C. Bossu Réaubourg"
version_tag: "1.0.0"
spacetime:
  metric_type: "Minkowski"
  central_mass: 0.0
  central_spin: 0.0
  central_charge: 0.0
  cosmological_lambda: 0.0
  wormhole_throat: 0.0
  warp_velocity: 0.0
  speed_of_light: 1.0
  gravitational_constant: 1.0
integrator:
  scheme: "RK45"
  initial_step: 0.05
  min_step: 1.0e-06
  max_step: 5.0
  relative_tolerance: 1.0e-8
  absolute_tolerance: 1.0e-12
output:
  fits_enabled: false
  hdf5_enabled: true
  vtk_enabled: false
  export_directory: "./output"
interactions:
  electricity_enabled: false
  magnetism_enabled: false
  vacuum_permittivity: 8.8541878128e-12
  vacuum_permeability: 1.25663706212e-6
  collisions_enabled: false
  collision_response_model: 0
  collision_consider_rotation: true
  collision_consider_friction: true
  collision_restitution_multiplier: 1.0
  collision_stiffness_scale: 1.0e-9
  collision_position_correction_factor: 0.2
  thermodynamics_enabled: true
  ambient_temperature_kelvin: 300.0
  radiative_coupling_scale: 1.0
  fragmentation_enabled: false
  fragmentation_tidal_stress_enabled: false
  minimum_fragment_mass: 1.0e-6
  max_fragments_per_event: 2
  collision_energy_to_integrity_loss: 1.0e-6
  tidal_stress_to_integrity_loss: 1.0e-6
  annihilation_enabled: false
  annihilation_contact_scale: 1.0
  annihilation_require_opposite_charge: true
bodies:
  - name: "Overheated Sphere"
    body_id: 1
    mass: 1.0
    radius: 1.0
    spin: 0.0
    charge: 0.0
    enabled: true
    color: [1.0, 0.3, 0.1, 1.0]
    color_secondary: [1.0, 0.75, 0.2, 1.0]
    magnetic_moment: 0.0
    rotation_speed: 0.0
    friction_coefficient: 0.0
    restitution: 0.0
    integrity: 1.0
    lifetime: 0.0
    temperature: 5000.0
    heat_capacity: 500.0
    absorption_factor: 1.0
    composition: "Isotropic graybody radiator"
    position: [0.0, 0.0, 0.0, 0.0]
    velocity: [0.0, 0.0, 0.0, 0.0]
    quadrupole: 0.0
    j2: 0.0
    j3: 0.0
    j4: 0.0
    reference_radius: 1.0
observers:
  - name: "PrimaryCamera"
    fov_deg: 60.0
    resolution: [1920, 1080]
    position: [0.0, 0.0, 15.0, 0.0]
    four_velocity: [1.0, 0.0, 0.0, 0.0]
